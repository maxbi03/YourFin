name: Garder le projet Supabase actif

# Le plan gratuit Supabase met le projet en pause après 7 jours sans la moindre requête,
# et il ne se réveille pas tout seul (il faut le restaurer à la main dans le dashboard).
# Ce workflow envoie une requête légère toutes les 3 jours — largement sous la limite —
# pour que YourFin reste utilisable sans surveillance, tant que le plan Pro (payant, jamais
# mis en pause) n'est pas nécessaire.
#
# Réglage requis une seule fois, une fois le projet Supabase créé :
#   Repo GitHub → Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL       ex. https://xxxxxxxxxxxx.supabase.co
#     SUPABASE_ANON_KEY  la clé publique "anon" du projet (Project Settings → API)

on:
  schedule:
    - cron: "17 4 */3 * *" # toutes les 3 jours à 4h17 UTC (heure décalée pour éviter les pics de charge GitHub)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touche la table keepalive
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL non configuré — projet Supabase pas encore créé, on ignore ce run."
            exit 0
          fi
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"pinged_at\":\"$now\"}")
          cat /tmp/response.txt
          if [ "$status" -ge 300 ]; then
            echo "Échec (HTTP $status)"
            exit 1
          fi
          echo "OK — projet Supabase pingé à $now"
